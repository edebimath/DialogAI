[project]
name = "dialogai-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[webrtc,silero,whisper,piper,google,runner]==1.12.0",
    # faster-whisper on the GPU needs cuBLAS and cuDNN 9; the pip wheels bring them on both
    # Windows (setup_cuda_dlls) and Linux (LD_LIBRARY_PATH in the Dockerfile).
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
    "pgvector==0.5.0",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.0",
    "pwdlib[argon2]==0.3.1",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "websockets", "playwright"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
