# Included in every location that sets its own headers (nginx drops inherited add_header then).
# style-src 'unsafe-inline': React Flow positions nodes with inline style attributes.
# media-src blob: call recordings play from fetched blobs. Microphone only for this site.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
